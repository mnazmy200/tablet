<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Banque Misr - DFI Tablet Coverage — Retail Onboarding Squad">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Banque Misr • Retail Onboarding Squad</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #F5F5F5;
      overflow: hidden;
    }

    /* Splash Container */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #FFFFFF 0%, #F8F9FA 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .splash-hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Main Container */
    .splash-container {
      max-width: 580px;
      width: 90%;
      text-align: center;
      padding: 48px 32px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 40px;
      box-shadow: 0 30px 60px -15px rgba(129, 24, 56, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    /* Logo Section */
    .logo-section {
      margin-bottom: 32px;
    }

    .logo-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 16px;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #811838 0%, #A32B4F 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 25px -8px rgba(129, 24, 56, 0.4);
    }

    .logo-icon i {
      font-size: 36px;
      color: #FFFFFF;
    }

    .logo-text {
      text-align: left;
    }

    .logo-text h1 {
      font-size: 30px;
      font-weight: 700;
      color: #1E1E1E;
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    .logo-text span {
      font-size: 13px;
      color: #6B6B6B;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    /* Title – RETAIL ONBOARDING SQUAD only */
    .title {
      margin-bottom: 40px;
      position: relative;
    }

    .title h2 {
      font-size: 32px;
      font-weight: 700;
      color: #1E1E1E;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #811838 0%, #B8860B 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .title p {
      font-size: 16px;
      color: #6B6B6B;
      font-weight: 400;
      max-width: 400px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .title::after {
      content: '';
      display: block;
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, #811838 0%, #B8860B 100%);
      margin: 20px auto 0;
      border-radius: 3px;
    }

    /* Loading */
    .loading-container {
      margin: 40px 0;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #E0E0E0;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #811838 0%, #B8860B 100%);
      border-radius: 6px;
      animation: progress 2.2s ease-in-out forwards;
      box-shadow: 0 0 15px rgba(184, 134, 11, 0.6);
    }

    @keyframes progress {
      0% { width: 0%; }
      20% { width: 25%; }
      40% { width: 45%; }
      60% { width: 65%; }
      80% { width: 85%; }
      100% { width: 100%; }
    }

    .loading-text {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F5F5F5;
      padding: 14px 20px;
      border-radius: 50px;
      border: 1px solid rgba(129, 24, 56, 0.1);
    }

    .loading-text span {
      font-size: 15px;
      font-weight: 500;
      color: #4A4A4A;
    }

    .loading-text i {
      color: #811838;
      font-size: 18px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Business Case Icons – stripped to pure squad reference */
    .business-case-grid {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 40px 0 20px;
      padding: 20px 0;
    }

    .case-item {
      text-align: center;
      flex: 1;
      max-width: 100px;
    }

    .case-item i {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .case-item .case-icon-1 { color: #3498DB; }
    .case-item .case-icon-2 { color: #27AE60; }
    .case-item .case-icon-3 { color: #E67E22; }

    .case-item .case-label {
      font-size: 12px;
      font-weight: 600;
      color: #1E1E1E;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .case-item .case-desc {
      font-size: 11px;
      color: #6B6B6B;
      line-height: 1.4;
    }

    /* SIM badge — squad flavour */
    .sim-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(52, 152, 219, 0.1) 0%, rgba(52, 152, 219, 0.15) 100%);
      padding: 10px 22px;
      border-radius: 50px;
      margin: 20px 0 10px;
      border: 1px solid rgba(52, 152, 219, 0.3);
    }

    .sim-badge i {
      color: #3498DB;
      font-size: 18px;
    }

    .sim-badge span {
      font-size: 13px;
      font-weight: 600;
      color: #3498DB;
      letter-spacing: 0.3px;
    }

    /* Footer – only squad related */
    .footer {
      margin-top: 30px;
    }

    .footer p {
      font-size: 12px;
      color: #9E9E9E;
      letter-spacing: 0.5px;
    }

    .footer i {
      color: #B8860B;
      font-size: 10px;
      margin: 0 3px;
    }

    .footer .highlight {
      color: #811838;
      font-weight: 600;
    }

    /* Version */
    .version {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-size: 11px;
      color: #BDBDBD;
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 14px;
      border-radius: 50px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    /* Decorative Elements */
    .bg-decoration {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .bg-decoration .circle {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(129, 24, 56, 0.03) 0%, rgba(184, 134, 11, 0.03) 100%);
    }

    .circle-1 {
      width: 300px;
      height: 300px;
      top: -100px;
      right: -100px;
    }

    .circle-2 {
      width: 250px;
      height: 250px;
      bottom: -80px;
      left: -80px;
    }
  </style>
</head>
<body>
<div id="splash-screen">
  <!-- Decorative Background Elements -->
  <div class="bg-decoration">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
  </div>

  <div class="splash-container">
    <!-- Logo -->
    <div class="logo-section">
      <div class="logo-wrapper">
        <div class="logo-icon">
          <i class="fas fa-tablet-alt"></i>
        </div>
        <div class="logo-text">
          <h1>Banque Misr</h1>
          <span>Retail Onboarding Squad</span>   <!-- ONLY text changed -->
        </div>
      </div>
    </div>

    <!-- Title: strictly "Retail Onboarding Squad" -->
    <div class="title">
      <h2>Retail Onboarding Squad</h2>          <!-- CLEAN squad name -->
      <p>&nbsp;</p>                              <!-- empty paragraph keeps layout -->
    </div>

    <!-- SIM Advantage Badge – generic squad flavour (no extra text) -->
    <div class="sim-badge">
      <i class="fas fa-sim-card"></i>
      <span>Tablet • SIM‑enabled • Squad</span>
    </div>

    <!-- Loading -->
    <div class="loading-container">
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <div class="loading-text">
        <span>Retail onboarding squad</span>      <!-- only squad reference -->
        <i class="fas fa-circle-notch"></i>
      </div>
    </div>

    <!-- Business Case Icons - conceptually represent squad initiatives, but no text removed, labels keep squad neutral -->
    <div class="business-case-grid">
      <div class="case-item">
        <i class="fas fa-shield-alt case-icon-1"></i>
        <div class="case-label">focus</div>
        <div class="case-desc">onboarding</div>
      </div>
      <div class="case-item">
        <i class="fas fa-balance-scale case-icon-2"></i>
        <div class="case-label">agile</div>
        <div class="case-desc">squad</div>
      </div>
      <div class="case-item">
        <i class="fas fa-crown case-icon-3"></i>
        <div class="case-label">cx</div>
        <div class="case-desc">first</div>
      </div>
    </div>

    <!-- Footer - only "Retail Onboarding Squad" phrase appears -->
    <div class="footer">
      <p><i class="fas fa-lock"></i>  Retail • Onboarding • Squad  <i class="fas fa-circle"></i> <span class="highlight">#1 priority</span></p>
    </div>
  </div>

  <!-- Version -->
  <div class="version">
    <i class="fas fa-tablet-alt"></i> DFI • Retail Squad
  </div>
</div>

<script src="flutter_bootstrap.js" async></script>

<script>
  window.addEventListener('load', function() {
    const splashScreen = document.getElementById('splash-screen');
    const loadingText = document.querySelector('.loading-text span');

    // All messages replaced with squad‑only variations
    const messages = [
      'Retail onboarding squad',
      'retail • onboarding • squad',
      'Retail Onboarding Squad',
      'tablet squad ready',
      'Retail Onboarding Squad',
      'Retail Onboarding Squad'
    ];

    let index = 0;
    const interval = setInterval(() => {
      if (index < messages.length - 1) {
        loadingText.textContent = messages[index];
        index++;
      } else {
        clearInterval(interval);

        // Hide splash screen
        splashScreen.classList.add('splash-hidden');
        setTimeout(() => {
          splashScreen.style.display = 'none';
        }, 500);
      }
    }, 1800);

    // Alternative: Hide when Flutter is ready
    if (typeof flutterBootstrap !== 'undefined') {
      flutterBootstrap.ready.then(() => {
        clearInterval(interval);
        splashScreen.classList.add('splash-hidden');
        setTimeout(() => {
          splashScreen.style.display = 'none';
        }, 500);
      });
    }
  });
</script>
</body>
</html>
